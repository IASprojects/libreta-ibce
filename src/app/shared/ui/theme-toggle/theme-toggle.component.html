<button
  class="theme-toggle"
  type="button"
  (click)="toggleTheme()"
  [attr.aria-label]="theme() === 'light' ? 'Cambiar a tema oscuro' : 'Cambiar a tema claro'"
  [attr.title]="theme() === 'light' ? 'Activar tema oscuro' : 'Activar tema claro'"
>
  @if (theme() === 'light') {
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.2 15.4A8.4 8.4 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path>
      <path d="M16.5 3.5v3M15 5h3M20 8v2M19 9h2"></path>
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
    </svg>
  }
  <span>{{ theme() === 'light' ? 'Oscuro' : 'Claro' }}</span>
</button>
