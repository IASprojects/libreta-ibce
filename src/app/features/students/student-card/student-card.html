<li class="student-card" [class.student-card--inactive]="isInactive()">
  <button
    type="button"
    class="student-card-button"
    (click)="onViewStudent()"
    [attr.aria-label]="'Ver detalles de ' + student().name + (isInactive() ? ' (inactivo)' : '')"
  >
    <div class="student-avatar" aria-hidden="true">
      <span class="avatar-initials">{{ getInitials(student().name) }}</span>
      @if (!isInactive() && student().hasUpcomingBirthday) {
        <span
          class="birthday-indicator"
          role="img"
          aria-label="Cumpleaños próximo"
          title="Cumpleaños {{ formatBirthday(student().birthDate) }}"
        >
          🎂
        </span>
      }
      @if (isInactive()) {
        <span class="inactive-indicator" aria-hidden="true" title="Inactivo"></span>
      }
    </div>

    <div class="student-info">
      <div class="student-name-row">
        <h3 class="student-name">{{ student().name }}</h3>
        @if (isInactive()) {
          <span class="inactive-badge" aria-label="Estudiante inactivo">Inactivo</span>
        }
      </div>
      <p class="student-phone">
        <span class="detail-icon" aria-hidden="true">📱</span>
        <span>{{ student().phone || 'Sin teléfono' }}</span>
      </p>

      <div class="student-details">
        <span class="detail-item">
          <span class="detail-icon" aria-hidden="true">Edad: </span>
          <span class="detail-text">{{ student().age }} años</span>
        </span>

        <span class="detail-item">
          <span class="detail-icon" aria-hidden="true">Asistió: </span>
          <span class="detail-text">{{ student().lastContactFormatted }}</span>
        </span>
      </div>

      <div class="student-contact">
        <span class="contact-icon" aria-hidden="true">📞</span>
        <span class="contact-text">{{ getMainContact(student()) }}</span>
      </div>

      @if (student().stats?.totalAttendances) {
        <div class="student-stats">
          <span
            class="stat-badge"
            [attr.aria-label]="'Total de asistencias: ' + student().stats?.totalAttendances"
          >
            ✓ {{ student().stats?.totalAttendances }}
          </span>
          @if ((student().stats?.currentStreak ?? 0) > 0) {
            <span
              class="stat-badge streak"
              [attr.aria-label]="'Racha actual: ' + student().stats?.currentStreak + ' clases'"
            >
              🔥 {{ student().stats?.currentStreak }}
            </span>
          }
          @if (student().stats?.lastYearPercentage !== undefined) {
            <span
              class="stat-badge percentage"
              [attr.aria-label]="
                'Porcentaje último año: ' + student().stats?.lastYearPercentage + '%'
              "
            >
              📊 {{ student().stats?.lastYearPercentage }}%
            </span>
          }
          @else{
            <span
              class="stat-badge percentage"
              aria-label="Porcentaje de asistencia en el último año no disponible"
            >
              📊 N/A
            </span>
          }
        </div>
      }
    </div>

    <span class="chevron-icon" aria-hidden="true">›</span>
  </button>
</li>
