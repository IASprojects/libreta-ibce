<section class="page-container" aria-labelledby="config-title">
  <header class="page-header">
    <h1 id="config-title">Configuración</h1>
    <p>Administra maestros y el catálogo oficial de unidades y lecciones.</p>
  </header>

  @if (serviceError()) {
    <div class="feedback-banner error" role="alert">
      {{ serviceError() }}
    </div>
  }

  <div class="settings-grid">
    <app-configuracion-teachers-panel
      [teachers]="teachers()"
      [teachersMessage]="teachersMessage()"
      [hasTeachers]="hasTeachers()"
      [teachersSaving]="teachersSaving()"
      [isLoading]="isLoading()"
      [availableTeacherOptionsCount]="availableTeacherOptions().length"
      [availableTeacherNames]="availableTeacherNames"
      (addTeacher)="addTeacher()"
      (removeTeacher)="removeTeacher($event)"
      (updateTeacherName)="handleTeacherNameChange($event)"
      (updateTeacherField)="handleTeacherFieldChange($event)"
      (saveTeachers)="saveTeachers()"
    />

    <app-configuracion-catalog-panel
      [lessonCatalog]="lessonCatalog()"
      [catalogMessage]="catalogMessage()"
      [hasLessonCatalog]="hasLessonCatalog()"
      [catalogSaving]="catalogSaving()"
      [isLoading]="isLoading()"
      (addUnit)="addUnit()"
      (removeUnit)="removeUnit($event)"
      (updateUnitField)="handleUnitFieldChange($event)"
      (addLesson)="addLesson($event)"
      (removeLesson)="handleLessonRemove($event)"
      (updateLessonField)="handleLessonFieldChange($event)"
      (saveLessonCatalog)="saveLessonCatalog()"
    />
  </div>
</section>
