<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Libreta IBCE</h2>
      <p>Inicia sesión para continuar</p>
    </div>
    
    <!-- Mensaje de error -->
    @if (error()) {
      <div class="error-message" (click)="clearError()">
        <div class="error-content">
          <span class="error-icon">⚠️</span>
          <pre class="error-text">{{ error() }}</pre>
          <button type="button" class="error-close" aria-label="Cerrar error">×</button>
        </div>
      </div>
    }
    
    <div class="login-content">
      <!-- Información sobre la cuenta autorizada -->
      <div class="authorized-email-info">
        <p class="authorized-text">
          <strong>Cuenta autorizada:</strong> {{ authorizedEmail() }}
        </p>
      </div>
      
      <button 
        class="google-btn" 
        (click)="signInWithGoogle()"
        [disabled]="isLoading()"
        [class.loading]="isLoading()">
        <div class="google-icon">
          @if (!isLoading()) {
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          } @else {
            <div class="loading-spinner"></div>
          }
        </div>
        @if (!isLoading()) {
          <span>Continuar con Google</span>
        } @else {
          <span>Iniciando sesión...</span>
        }
      </button>
    </div>

    <!-- Información del usuario actual (solo para debugging/info) -->
    @if (user(); as currentUser) {
      <div class="login-footer">
        <div class="user-info">
          @if (currentUser.photoURL) {
            <img [src]="currentUser.photoURL" [alt]="currentUser.displayName || 'Usuario'" class="user-avatar">
          } @else {
            <div class="user-avatar-placeholder">👤</div>
          }
          <div>
            <p class="user-name">{{ currentUser.displayName || 'Maestro' }}</p>
            <p class="user-email">{{ currentUser.email }}</p>
          </div>
        </div>
        <button class="logout-btn" (click)="signOut()">Cerrar sesión</button>
      </div>
    }
  </div>
</div>
