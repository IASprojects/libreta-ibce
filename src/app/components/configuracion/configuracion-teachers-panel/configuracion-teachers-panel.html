<section class="settings-panel" aria-labelledby="teachers-title">
  <div class="panel-header">
    <div>
      <h2 id="teachers-title">Maestros</h2>
      <p>Mantén nombres habilitados, teléfonos, correos y estado activo.</p>
    </div>
    <button
      type="button"
      class="btn btn-secondary"
      (click)="onAddTeacher()"
      [disabled]="teachersSaving() || availableTeacherOptionsCount() === 0"
    >
      Agregar maestro
    </button>
  </div>

  @if (teachersMessage()) {
    <p class="feedback-inline" [class.error-text]="teachersMessage()?.includes('No ') || teachersMessage()?.includes('duplicados')">
      {{ teachersMessage() }}
    </p>
  }

  @if (!hasTeachers()) {
    <p class="empty-copy">No hay maestros configurados.</p>
  }

  <div class="stack-list">
    @for (teacher of teachers(); track trackByTeacher($index, teacher)) {
      <article class="editor-card">
        <div class="editor-grid teacher-grid">
          <label class="field-group">
            <span class="field-label">Nombre</span>
            <select
              class="field-control"
              [ngModel]="teacher.name"
              (ngModelChange)="onUpdateTeacherName($index, $event)"
            >
              <option [ngValue]="teacher.name">{{ teacher.name }}</option>
              @for (name of availableTeacherNames(); track name) {
                @if (canUseTeacherName(name, teacher.name)) {
                  <option [ngValue]="name">{{ name }}</option>
                }
              }
            </select>
          </label>

          <label class="field-group">
            <span class="field-label">Teléfono</span>
            <input
              type="tel"
              class="field-control"
              [ngModel]="teacher.phone"
              (ngModelChange)="onUpdateTeacherField($index, 'phone', $event)"
              placeholder="8090000000"
            />
          </label>

          <label class="field-group">
            <span class="field-label">Correo</span>
            <input
              type="email"
              class="field-control"
              [ngModel]="teacher.email"
              (ngModelChange)="onUpdateTeacherField($index, 'email', $event)"
              placeholder="correo@iglesia.org"
            />
          </label>

          <label class="field-group">
            <span class="field-label">Ingreso</span>
            <input
              type="date"
              class="field-control"
              [ngModel]="teacher.joinedAt"
              (ngModelChange)="onUpdateTeacherField($index, 'joinedAt', $event)"
            />
          </label>

          <label class="toggle-field">
            <input
              type="checkbox"
              [ngModel]="teacher.isActive"
              (ngModelChange)="onUpdateTeacherField($index, 'isActive', $event)"
            />
            <span>Activo</span>
          </label>
        </div>

        <div class="card-actions">
          <button type="button" class="btn btn-danger" (click)="onRemoveTeacher($index)">
            Quitar
          </button>
        </div>
      </article>
    }
  </div>

  <div class="panel-actions">
    <button
      type="button"
      class="btn btn-primary"
      (click)="onSaveTeachers()"
      [disabled]="teachersSaving() || isLoading()"
    >
      {{ teachersSaving() ? 'Guardando...' : 'Guardar maestros' }}
    </button>
  </div>
</section>
