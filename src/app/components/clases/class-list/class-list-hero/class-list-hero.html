<section class="hero-section" [class.with-editor]="showEditor()">
  <div class="hero-content">
    <h1>Registrar Asistencia</h1>  
    @if (!showEditor() && !isInitialLoading()) {
      <div class="quick-actions">
        <button
          type="button"
          class="action-card secondary"
          (click)="onCreateClass()"
          aria-label="Tomar asistencia"
        >
          <span class="icon">➕ Tomar asistencia</span> 
        </button>
      </div>
    }
  </div>

  @if (!showEditor() && totalClasses() > 0) {
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-value">{{ totalClasses() }}</span>
        <span class="stat-label"
          >Clase{{ totalClasses() !== 1 ? 's' : '' }} registrada{{ totalClasses() !== 1 ? 's' : '' }}</span
        >
      </div>
      @if (recentCount() > 0) {
        <div class="stat">
          <span class="stat-value">{{ recentCount() }}</span>
          <span class="stat-label">Semana actual</span>
        </div>
      }
    </div>
  }
</section>
