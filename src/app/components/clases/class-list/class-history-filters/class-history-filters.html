<div class="filters-section">
  <app-filter-bar
    [mobileOpen]="showMobileFilters()"
    mobileTitle="Filtros de historial"
    (toggleMobile)="toggleMobileFilters()"
    (closeMobile)="closeMobileFilters()"
    (applyMobile)="closeMobileFilters()"
  >
    <div class="filter-group">
      <label for="teacherFilter" class="filter-label">Maestro</label>
      <select
        id="teacherFilter"
        class="filter-select"
        [value]="filterTeacher()"
        (change)="onTeacherChange($any($event.target).value)"
      >
        <option value="all">Todos los maestros</option>
        @for (teacher of uniqueTeachers(); track teacher) {
          <option [value]="teacher">{{ teacher }}</option>
        }
      </select>
    </div>

    <div class="filter-group">
      <label for="periodFilter" class="filter-label">Periodo</label>
      <select
        id="periodFilter"
        class="filter-select"
        [value]="filterPeriod()"
        (change)="onPeriodChange($any($event.target).value)"
      >
        <option value="all">Todos los periodos</option>
        <option value="today">Hoy</option>
        <option value="week">Esta semana</option>
        <option value="month">Este mes</option>
        <option value="year">Este año</option>
      </select>
    </div>

    <div class="search-group">
      <label for="classHistorySearch" class="visually-hidden">Buscar clase</label>
      <div class="search-input-wrapper">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          id="classHistorySearch"
          type="search"
          class="search-input"
          placeholder="Buscar por unidad, lección, maestro o nota..."
          [value]="searchTerm()"
          (input)="onSearchChange($any($event.target).value)"
          autocomplete="off"
          aria-label="Buscar clase por unidad, lección, maestro o nota"
        />
        @if (searchTerm()) {
          <button
            type="button"
            class="clear-search-btn"
            (click)="onClearSearch()"
            aria-label="Limpiar búsqueda"
          >
            ✕
          </button>
        }
      </div>
    </div>

    @if (showClearFilters()) {
      <button
        type="button"
        class="clear-filters-btn"
        (click)="onClearFilters()"
        aria-label="Limpiar filtros"
      >
        Limpiar filtros
      </button>
    }
  </app-filter-bar>
</div>
