<div class="alert" [class.alert-error]="variant() === 'error'" [class.alert-success]="variant() === 'success'" [attr.role]="role()">
  <span class="alert-icon">{{ icon() }}</span>
  <div class="alert-content">
    @if (title()) {
      <p class="alert-title">{{ title() }}</p>
    }
    <p class="alert-message">{{ message() }}</p>
  </div>
  <button
    type="button"
    class="alert-close"
    (click)="onDismiss()"
    (keydown.enter)="onDismiss()"
    [attr.aria-label]="dismissLabel()"
  >
    ×
  </button>
</div>
