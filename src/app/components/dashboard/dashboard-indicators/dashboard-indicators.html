<!-- Indicadores principales -->
<div class="indicators-grid">
  <!-- Contador de clases -->
  <a
    class="indicator-card primary indicator-card-link"
    [routerLink]="['/dashboard/clases']"
    aria-label="Ir a la sección de clases"
  >
    <div class="indicator-icon">📚</div>
    <div class="indicator-content">
      <h3>{{ totalClasses() }}</h3>
      <p>Clases Registradas</p>
      <small class="indicator-action-hint" aria-hidden="true">Ir a clases</small>
    </div>
  </a>

  <!-- Promedio de asistencia -->
  <a
    class="indicator-card success indicator-card-link indicator-card-actionable"
    [routerLink]="['/dashboard/clases']"
    [queryParams]="classNavigationQueryParams()"
    [attr.aria-label]="averageAttendanceAriaLabel()"
    (keydown.space)="onIndicatorSpaceKeydown($event)"
  >
    <div class="indicator-icon">👥</div>
    <div class="indicator-content">
      <h3>{{ averageAttendance() }}</h3>
      <p>Presentes Última Semana</p>
      <small class="indicator-action-hint" aria-hidden="true">{{ classActionHint() }}</small>
    </div>
  </a>

  <!-- Última clase -->
  <a
    class="indicator-card info indicator-card-link indicator-card-actionable"
    [routerLink]="['/dashboard/clases']"
    [queryParams]="classNavigationQueryParams()"
    [attr.aria-label]="lastClassAriaLabel()"
    (keydown.space)="onIndicatorSpaceKeydown($event)"
  >
    <div class="indicator-icon">🕒</div>
    <div class="indicator-content">
      <h3>{{ lastClassDate() }}</h3>
      <p>Última Clase</p>
      <small>Por: {{ lastTeacher() }}</small>
      <small class="indicator-action-hint" aria-hidden="true">{{ classActionHint() }}</small>
    </div>
  </a>
</div>
