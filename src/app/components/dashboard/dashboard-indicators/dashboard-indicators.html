<!-- Indicadores principales -->
<div class="indicators-grid">
  <!-- Contador de clases -->
  <a
    class="indicator-card primary indicator-card-link"
    [routerLink]="['/dashboard/clases']"
    aria-label="Ir a la sección de clases"
  >
    <div class="indicator-icon">📚</div>
    <div class="indicator-content">
      <h3>{{ totalClasses() }}</h3>
      <p>Clases Registradas</p>
      <small class="indicator-action-hint" aria-hidden="true">Ir a clases</small>
    </div>
  </a>

  <!-- Promedio de asistencia -->
  <div class="indicator-card success">
    <div class="indicator-icon">👥</div>
    <div class="indicator-content">
      <h3>{{ averageAttendance() }}</h3>
      <p>Presentes Última Semana</p>
    </div>
  </div>

  <!-- Última clase -->
  <div class="indicator-card info">
    <div class="indicator-icon">🕒</div>
    <div class="indicator-content">
      <h3>{{ lastClassDate() }}</h3>
      <p>Última Clase</p>
      <small>Por: {{ lastTeacher() }}</small>
    </div>
  </div>
</div>
