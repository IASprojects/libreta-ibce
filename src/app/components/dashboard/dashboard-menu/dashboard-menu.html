<nav
  class="dashboard-menu"
  [class.collapsed]="collapsed()"
  [class.menu-open]="mobileOpen()"
  aria-label="Menu lateral"
>
  <div class="menu-header">
   <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 4H20V20H4V4Z" stroke="#8B5A2B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF"/>
  <path d="M8 7H16" stroke="#8B5A2B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8 11H16" stroke="#8B5A2B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8 15H13" stroke="#8B5A2B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M4 4L20 4" stroke="#8B5A2B" stroke-width="1.5"/>
  <path d="M4 20L20 20" stroke="#8B5A2B" stroke-width="1.5"/>
</svg> <h2 class="menu-title">Libreta IBCE</h2>
  </div>

  <ul class="menu-list">
    @for (item of menuItems; track item.route) {
      <li class="menu-item">
        <a 
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
          class="menu-link"
          (click)="onNavigate()"
          [attr.title]="item.description">
          <span class="menu-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              @switch (item.icon) {
                @case ('dashboard') {
                  <path d="M4 5.75A1.75 1.75 0 0 1 5.75 4h4.5A1.75 1.75 0 0 1 12 5.75v4.5A1.75 1.75 0 0 1 10.25 12h-4.5A1.75 1.75 0 0 1 4 10.25z"></path>
                  <path d="M14 7.25A3.25 3.25 0 0 1 17.25 4h1.5A3.25 3.25 0 0 1 22 7.25v.5A3.25 3.25 0 0 1 18.75 11h-1.5A3.25 3.25 0 0 1 14 7.75z"></path>
                  <path d="M4 16.25A3.25 3.25 0 0 1 7.25 13h1.5A3.25 3.25 0 0 1 12 16.25v.5A3.25 3.25 0 0 1 8.75 20h-1.5A3.25 3.25 0 0 1 4 16.75z"></path>
                  <path d="M14 13.75A1.75 1.75 0 0 1 15.75 12h4.5A1.75 1.75 0 0 1 22 13.75v4.5A1.75 1.75 0 0 1 20.25 20h-4.5A1.75 1.75 0 0 1 14 18.25z"></path>
                }
                @case ('students') {
                  <path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
                  <path d="M17 10a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"></path>
                  <path d="M3.5 19.5A4.5 4.5 0 0 1 8 15h2a4.5 4.5 0 0 1 4.5 4.5V20h-11z"></path>
                  <path d="M14.5 20a3.5 3.5 0 0 1 3.5-3h.5a3 3 0 0 1 3 3H14.5z"></path>
                }
                @case ('planner') {
                  <path d="M7 3v2"></path>
                  <path d="M17 3v2"></path>
                  <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                  <path d="M4 9h16"></path>
                  <path d="M8 13h3"></path>
                  <path d="M13 13h3"></path>
                  <path d="M8 16h3"></path>
                }
                @case ('classes') {
                  <path d="M5.5 4.5A1.5 1.5 0 0 1 7 3h9.5A2.5 2.5 0 0 1 19 5.5V18a2 2 0 0 0-2-2H7A1.5 1.5 0 0 0 5.5 17.5z"></path>
                  <path d="M7 3v13"></path>
                  <path d="M10 7h5"></path>
                  <path d="M10 10h5"></path>
                  <path d="M10 13h3"></path>
                }
                @case ('settings') {
                  <path d="M12 8.75a3.25 3.25 0 1 0 0 6.5 3.25 3.25 0 0 0 0-6.5Z"></path>
                  <path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1.8 1.8 0 0 1-2.55 2.55l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.92V20a1.8 1.8 0 1 1-3.6 0v-.15a1 1 0 0 0-.6-.92 1 1 0 0 0-1.1.2l-.1.1A1.8 1.8 0 1 1 4.6 16.2l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.92-.6H4a1.8 1.8 0 1 1 0-3.6h.15a1 1 0 0 0 .92-.6 1 1 0 0 0-.2-1.1l-.1-.1A1.8 1.8 0 1 1 7.32 4.6l.1.1a1 1 0 0 0 1.1.2h.01a1 1 0 0 0 .6-.92V4a1.8 1.8 0 1 1 3.6 0v.15a1 1 0 0 0 .6.92 1 1 0 0 0 1.1-.2l.1-.1A1.8 1.8 0 0 1 19.4 7.32l-.1.1a1 1 0 0 0-.2 1.1v.01a1 1 0 0 0 .92.6H20a1.8 1.8 0 1 1 0 3.6h-.15a1 1 0 0 0-.92.6Z"></path>
                }
              }
            </svg>
          </span>
          <span class="menu-label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <div class="menu-footer">
      <app-dashboard-userinfo (logoutClick)="signOut()"></app-dashboard-userinfo>
  </div>
</nav>
